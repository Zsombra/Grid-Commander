name: Spec Layer

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Runs the same entry point contributors run, across the interpreter range
  # the tool claims to support. The jobs below restate their commands inline;
  # this one calls scripts/check.sh, so the script cannot rot while looking
  # maintained — a script nothing exercises is not a fallback.
  matrix:
    name: checks (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run every gate
        run: ./scripts/check.sh

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Same deliberate omission as below: no dependency install. The suite
      # asserts the tool imports only the standard library, and this job is
      # what makes that assertion mean something.
      - name: Run the harness regression suite
        shell: bash
        run: |
          set +e
          output=$(python3 -m unittest discover -s tests -v 2>&1)
          status=$?
          set -e

          {
            echo '### Harness regression tests'
            echo ''
            echo '```'
            echo "$output" | tail -n 40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "$output"
          exit $status

  app:
    name: app
    runs-on: ubuntu-latest

    # The repositories had never executed a statement. Everything they promise —
    # single-use confirmations, single-use OAuth state, the uniqueness one
    # identity per BattleGrid account rests on — is enforced by PostgreSQL, so a
    # fake could only ever agree with the code. This is where that stops.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gridcommander
          POSTGRES_PASSWORD: gridcommander
          POSTGRES_DB: gridcommander
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gridcommander"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Four gates, run separately so a failure names which one broke.
      # typecheck is not redundant with the tests: several safety guards are
      # enforced by the type system, and a mutation removing one fails here
      # rather than in vitest.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Nor is the build redundant with typecheck, which is what this project
      # assumed for its whole life. `tsc --noEmit` type-checks every file under
      # app/ and has no opinion about whether Next.js can assemble them into an
      # application — so a missing root layout left the build broken through
      # thirteen routes and six changes, with this job green throughout.
      #
      # Deliberately carries no environment. The build needs no configuration,
      # and a step holding placeholder credentials invites a real one.
      - name: Build
        run: npm run build

      # Detectable from the repository alone, with no database: regenerating
      # against the committed snapshot produces nothing when they agree, and a
      # new migration file when they do not.
      #
      # `drizzle-kit check` is NOT this check, despite the name — it validates
      # the journal's internal consistency and reports "Everything's fine" for a
      # schema that has drifted. Adding it here instead would look like coverage
      # and provide none.
      - name: Schema matches migrations
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::The Drizzle schema has changed without a migration. Run 'npm run db:generate' and commit drizzle/."
            git status --porcelain drizzle/
            git --no-pager diff -- drizzle/
            exit 1
          fi

      # Applied from the committed journal, against an empty database, every
      # run — so the migrations are exercised, not merely present.
      - name: Apply migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://gridcommander:gridcommander@localhost:5432/gridcommander

      # The build proves the application can be assembled. This proves it can be
      # *started* from what .env.example documents, which is a different claim
      # and the one that has failed twice — a malformed encryption key, then a
      # SESSION_SECRET the example never mentioned. Both returned 500 on every
      # authenticated route with every other gate on this job green.
      #
      # The variable list comes from .env.example, never from the script, so a
      # variable the application requires and the example omits is never set and
      # this step fails. Deliberately carries only DATABASE_URL: everything else
      # must be documented to be supplied.
      - name: Serving is gated
        run: ./scripts/check-serving.sh
        env:
          DATABASE_URL: postgres://gridcommander:gridcommander@localhost:5432/gridcommander

      # `npm test` above needs no database and does not run these. This step is
      # the only place they run, and it fails rather than skips when
      # DATABASE_URL is missing — so there is no configuration under which these
      # appear to have run and did not.
      - name: Database tests
        run: npm run test:db
        env:
          DATABASE_URL: postgres://gridcommander:gridcommander@localhost:5432/gridcommander

  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # No dependency install step, deliberately. openspec.py is zero-dependency
      # and this job is what keeps that true — adding a `pip install` here should
      # be treated as a regression, not a fix.
      - name: Validate spec, backlog, and design layers
        shell: bash
        run: |
          set +e
          output=$(python3 .claude/tools/openspec.py validate --all 2>&1)
          status=$?
          set -e

          {
            echo '### Spec layer validation'
            echo ''
            echo '```'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "$output"
          exit $status
