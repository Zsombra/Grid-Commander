name: Spec Layer

on:
  pull_request:
  push:
    branches: [main]
  # Lets a run be started by hand. Added while diagnosing a period where the
  # repository created no runs at all — with only event-driven triggers there
  # is no way to ask for one, so "did it not run, or did it not start?" cannot
  # be answered from the outside.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Temporary. Every job in runs 38 and 39 failed within 2-9 seconds and
  # produced no downloadable logs, which cannot be diagnosed from the API. This
  # job uses no actions and no checkout: if it fails, the problem is the runner
  # or the repository's Actions configuration, not anything in this file.
  # Remove once the cause is known.
  probe:
    name: probe
    runs-on: ubuntu-latest
    steps:
      - name: Prove a runner can execute a step
        run: |
          echo "runner ok: $(uname -a)"
          echo "python3: $(python3 --version 2>&1 || echo absent)"

  # Runs the same entry point contributors run, across the interpreter range
  # the tool claims to support. The two jobs below restate their commands
  # inline; this one calls scripts/check.sh, so the script cannot rot while
  # looking maintained — a script nothing exercises is not a fallback.
  matrix:
    name: checks (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run every gate
        run: ./scripts/check.sh

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Same deliberate omission as below: no dependency install. The suite
      # asserts the tool imports only the standard library, and this job is
      # what makes that assertion mean something.
      - name: Run the harness regression suite
        shell: bash
        run: |
          set +e
          output=$(python3 -m unittest discover -s tests -v 2>&1)
          status=$?
          set -e

          {
            echo '### Harness regression tests'
            echo ''
            echo '```'
            echo "$output" | tail -n 40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "$output"
          exit $status

  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # No dependency install step, deliberately. openspec.py is zero-dependency
      # and this job is what keeps that true — adding a `pip install` here should
      # be treated as a regression, not a fix.
      - name: Validate spec, backlog, and design layers
        shell: bash
        run: |
          set +e
          output=$(python3 .claude/tools/openspec.py validate --all 2>&1)
          status=$?
          set -e

          {
            echo '### Spec layer validation'
            echo ''
            echo '```'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "$output"
          exit $status
